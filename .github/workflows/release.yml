name: release

# Tag push (vX.Y.Z) builds, tests and publishes a GitHub release.
# Branch pushes that touch packaging build and test the packages without publishing.
# workflow_dispatch builds artifacts only.
on:
  push:
    tags: ['v*']
    branches: ['**']
    paths:
      - 'packaging/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: 6.10.3

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version from CMakeLists.txt
        run: |
          version=$(sed -n 's/^project(anyprocessorqt VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version $version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match project(VERSION $version)"
            exit 1
          fi

  # x86_64: Qt from the Qt installer, built on 22.04 (glibc 2.35 < bookworm's 2.36).
  linux:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            qt_host: linux
            qt_arch: linux_gcc_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libegl1 libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-xinput0 libwayland-client0 libwayland-cursor0 libwayland-egl1 libfontconfig1 fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation2 file
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Qt platform plugins
        run: echo "::notice::platforms in $QT_ROOT_DIR/plugins/platforms -> $(ls "$QT_ROOT_DIR/plugins/platforms" | tr '\n' ' ')"
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release > step.log 2>&1 || { cat step.log; grep -inE "error|missing|fail|cannot|not found|undefined" step.log | tail -n 8 | sed 's/^/::error::/'; tail -n 2 step.log | sed 's/^/::error::/'; exit 1; }
          cat step.log
          cmake --build build -j4 > step.log 2>&1 || { cat step.log; grep -inE "error|missing|fail|cannot|not found|undefined" step.log | tail -n 8 | sed 's/^/::error::/'; tail -n 2 step.log | sed 's/^/::error::/'; exit 1; }
          cat step.log
      - name: Test
        run: ./build/anyprocessorqt_tests tests/fixtures/features.docx
      - name: AppImage
        run: |
          bash packaging/linux/bundle-appimage.sh build dist > step.log 2>&1 || { cat step.log; grep -inE "error|missing|fail|cannot|not found|undefined" step.log | tail -n 8 | sed 's/^/::error::/'; tail -n 2 step.log | sed 's/^/::error::/'; exit 1; }
          cat step.log
      - name: Smoke test AppImage
        run: |
          app=$(ls dist/*.AppImage)
          "$app" --appimage-extract-and-run --roundtrip tests/fixtures/features.docx rt.docx
          "$app" --appimage-extract-and-run --pdf rt.docx rt.pdf
          test -s rt.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error

  # aarch64: the Qt installer's ARM64 Qt 6.10 needs glibc 2.38, which bookworm
  # doesn't have, so build inside bookworm against Debian's own Qt (6.4.2).
  linux-arm64:
    needs: meta
    runs-on: ubuntu-22.04-arm
    container: debian:bookworm
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake qt6-base-dev qt6-base-dev-tools qt6-wayland libgl-dev libxkbcommon-dev curl file ca-certificates fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation2
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release > step.log 2>&1 || { cat step.log; grep -inE "error|missing|fail|cannot|not found|undefined" step.log | tail -n 8 | sed 's/^/::error::/'; exit 1; }
          cmake --build build -j4 > step.log 2>&1 || { cat step.log; grep -inE "error|missing|fail|cannot|not found|undefined" step.log | tail -n 8 | sed 's/^/::error::/'; exit 1; }
      - name: Test
        run: ./build/anyprocessorqt_tests tests/fixtures/features.docx
      - name: AppImage
        run: |
          bash packaging/linux/bundle-appimage.sh build dist > step.log 2>&1 || { cat step.log; grep -inE "error|missing|fail|cannot|not found|undefined" step.log | tail -n 8 | sed 's/^/::error::/'; tail -n 2 step.log | sed 's/^/::error::/'; exit 1; }
          cat step.log
      - name: Smoke test AppImage
        run: |
          app=$(ls dist/*.AppImage)
          "$app" --appimage-extract-and-run --roundtrip tests/fixtures/features.docx rt.docx
          "$app" --appimage-extract-and-run --pdf rt.docx rt.pdf
          test -s rt.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: dist/*.AppImage
          if-no-files-found: error

  # Stock Debian bookworm, the base of the ChromeOS Linux container. No Qt and no
  # xcb-cursor installed: everything must come from the AppImage.
  bookworm:
    needs: [linux, linux-arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist
      - name: Desktop basics only
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xvfb xauth weston libgl1 libegl1 fontconfig fonts-crosextra-carlito
      - name: X11 (xcb)
        run: |
          app=$(ls dist/*.AppImage)
          chmod +x "$app"
          set +e
          QT_QPA_PLATFORM=xcb xvfb-run -a -s "-screen 0 1280x1000x24" "$app" --appimage-extract-and-run --screenshot x11.png tests/fixtures/features.docx > x11.log 2>&1
          rc=$?
          cat x11.log
          if [ $rc -ne 0 ] || [ ! -s x11.png ]; then
            echo "::error::exit $rc"
            grep -v '^$' x11.log | tail -n 9 | sed 's/^/::error::/'
            exit 1
          fi
      - name: Wayland
        if: always()
        run: |
          app=$(ls dist/*.AppImage)
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wl-test --width=1280 --height=1000 > weston.log 2>&1 &
          for i in $(seq 1 20); do [ -S "$XDG_RUNTIME_DIR/wl-test" ] && break; sleep 0.5; done
          set +e
          WAYLAND_DISPLAY=wl-test QT_QPA_PLATFORM=wayland "$app" --appimage-extract-and-run --screenshot wayland.png tests/fixtures/features.docx > wayland.log 2>&1
          rc=$?
          cat wayland.log
          if grep -q "No shell integration" wayland.log; then
            echo "::error::Wayland shell integration plugins missing from the AppImage"
            exit 1
          fi
          if [ $rc -ne 0 ] || [ ! -s wayland.png ]; then
            echo "::error::exit $rc"
            grep -v '^$' wayland.log | tail -n 6 | sed 's/^/::error::/'
            tail -n 3 weston.log | sed 's/^/::error::weston: /'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bookworm-screens-${{ matrix.arch }}
          path: |
            *.png
            *.log

  macos:
    needs: meta
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          cache: true
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
      - name: Test
        run: ./build/anyprocessorqt_tests tests/fixtures/features.docx
      - name: DMG
        run: |
          bash packaging/macos/bundle-mac.sh build dist > step.log 2>&1 || { cat step.log; grep -inE "error|missing|fail|cannot|not found|undefined" step.log | tail -n 8 | sed 's/^/::error::/'; tail -n 2 step.log | sed 's/^/::error::/'; exit 1; }
          cat step.log
      - name: Smoke test bundle
        run: |
          ./build/macstage/anyprocessorqt.app/Contents/MacOS/anyprocessorqt --roundtrip tests/fixtures/features.docx rt.docx
          test -s rt.docx
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: meta
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          arch: win64_msvc2022_64
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j4
      - name: Test
        shell: bash
        run: ./build/Release/anyprocessorqt_tests.exe tests/fixtures/features.docx
      - name: Zip
        shell: bash
        run: bash packaging/windows/bundle-windows.sh build dist
      - name: Smoke test package
        shell: bash
        run: |
          pkg=$(ls -d dist/anyprocessorqt-*-windows-x64)
          # Qt must come from the package, not from the installed Qt on PATH.
          PATH="/usr/bin:/c/Windows/System32:/c/Windows" "$pkg/anyprocessorqt.exe" --roundtrip tests/fixtures/features.docx rt.docx
          test -s rt.docx
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [meta, linux, linux-arm64, bookworm, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '{linux-*,macos,windows}'
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" --title "anyprocessorqt ${{ needs.meta.outputs.version }}" --generate-notes
